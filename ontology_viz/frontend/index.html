<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ontology 3D Monitor</title>
    <link rel="stylesheet" href="/viewer/styles.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="viewport-panel">
        <header class="topbar">
          <div>
            <h1 id="graphTitle">Ontology 3D Monitor</h1>
            <p id="graphMeta">Waiting for live graph</p>
          </div>
          <div class="topbar-actions">
            <input id="sourceInput" type="text" value="http://127.0.0.1:8765/events" aria-label="Graph source">
            <button id="liveButton" type="button" title="Connect to live stream">Live</button>
            <button id="loadButton" type="button" title="Load one snapshot">Load</button>
            <button id="resetButton" type="button" title="Reset camera">Reset</button>
          </div>
        </header>
        <div id="graphCanvas" class="graph-canvas"></div>
        <div id="statusLine" class="status-line">idle</div>
      </section>

      <aside class="inspector">
        <section>
          <h2>Selected</h2>
          <div id="selectedTitle" class="selected-title">None</div>
          <pre id="metadataPanel">{}</pre>
        </section>
        <section>
          <h2>Connections</h2>
          <div id="connectionPanel" class="connection-list"></div>
        </section>
        <section>
          <h2>Reasoning Trace</h2>
          <div id="tracePanel" class="trace-list"></div>
        </section>
      </aside>
    </main>
    <script type="module" src="/viewer/app.js"></script>
  </body>
</html>
