modes:
  DIRECT_DESCENT:
    horizontal_gain: 0.35
    vertical_rate_mps: 0.16
    lookahead_s: 0.2
  TRACKING_APPROACH:
    horizontal_gain: 0.90
    vertical_rate_mps: 0.14
    lookahead_s: 0.9
  CONSERVATIVE_APPROACH:
    horizontal_gain: 0.65
    vertical_rate_mps: 0.08
    lateral_offset_m: 1.2
    lookahead_s: 0.8
  MINIMUM_TIME_APPROACH:
    horizontal_gain: 1.10
    vertical_rate_mps: 0.25
    lookahead_s: 1.2
  HOVER_AND_ALIGN:
    horizontal_gain: 0.35
    vertical_rate_mps: 0.0
  ASCEND_AND_RESEARCH:
    climb_rate_mps: 0.5
    search_altitude_m: 4.0
  ABORT_LANDING:
    climb_rate_mps: 0.8
    abort_altitude_m: 8.0
  EMERGENCY_LAND:
    horizontal_gain: 0.80
    vertical_rate_mps: 0.22

precision_landing:
  approach_radius_m: 2.5
  alignment_radius_m: 0.65
  final_alignment_radius_m: 0.28
  hold_height_above_pad_m: 0.70
  max_relative_speed_mps: 0.45
  max_horizontal_speed_mps: 0.70
  max_step_m: 0.85
  final_max_step_m: 0.22
  final_vertical_rate_mps: 0.16
